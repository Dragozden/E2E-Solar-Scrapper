# Docker Compose automatically merges this file with docker/docker-compose.yml.
# Do not run 'docker compose down -v': postgres_data holds historical observations.
services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    container_name: solar-airflow
    command: standalone
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PYTHONPATH: /opt/airflow/solar
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/simple_auth_manager_passwords.json.generated
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
    volumes:
      - ../airflow/dags:/opt/airflow/dags:rw
      - ../scraper:/opt/airflow/solar/scraper:rw
      - ../dbt/solar_dbt:/opt/airflow/solar/dbt:rw
      - solar_airflow_state:/opt/airflow/state
      - solar_airflow_logs:/opt/airflow/logs
    depends_on:
      - postgres

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    container_name: solar-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    # Created locally by scripts/setup_dashboard_reader.py (never commit it).
    env_file:
      - ../dashboard/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  solar_airflow_state:
  solar_airflow_logs:
